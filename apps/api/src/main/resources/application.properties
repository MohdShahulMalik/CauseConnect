spring.application.name=CauseConnect Server

# WorkOS JWT Configuration
# These values are used to validate JWT tokens issued by WorkOS AuthKit
workos.jwt.issuer-uri=https://api.workos.com/sso
workos.jwt.jwk-set-uri=https://api.workos.com/.well-known/jwks.json

# Alternatively, if using Spring Security OAuth2 Resource Server defaults:
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://api.workos.com/sso
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://api.workos.com/.well-known/jwks.json

# WorkOS API Key (for server-side API calls if needed)
# workos.api.key=${WORKOS_API_KEY:}

# Database Configuration (PostgreSQL)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/causeconnect}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Neo4j Configuration (Graph Database)
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:password}

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Server Configuration
server.port=${PORT:8080}

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.merzah.causeconnect=DEBUG
